name: MCP development

on:
  pull_request:
    paths: ['.agents/**', 'examples/mcp/**', '.github/workflows/mcp-development.yml', 'tests/test_development.py', 'tests/test_mcp_examples.py', 'src/repo_template/development.py']
  push:
    branches: [main]
    paths: ['.agents/**', 'examples/mcp/**', '.github/workflows/mcp-development.yml', 'tests/test_development.py', 'tests/test_mcp_examples.py', 'src/repo_template/development.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  langchain-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGSMITH_TRACING: 'false'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --project examples/mcp/langchain --locked --dev --python 3.12
      - run: uv run --directory examples/mcp/langchain --locked pytest

  legacy-langchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --project examples/mcp/legacy-langchain --locked --dev --python 3.12
      - run: uv run --directory examples/mcp/legacy-langchain --locked pytest

  python-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/mcp/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15"
      - run: uv python install 3.12
      - run: uv sync --locked --dev --python 3.12
      - run: uv run pytest
  typescript-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/mcp/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.22.0'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npx --no-install @modelcontextprotocol/inspector --help
