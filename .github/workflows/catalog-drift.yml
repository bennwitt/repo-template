name: Catalog drift

# Weekly, compare every vendored skill and license text with its upstream repository, and each
# MCP server's pin with npm or PyPI. Read-only: the report goes to this log; upgrading a skill is
# a reviewed, local `repo-template globals --upgrade`, and re-pinning is an edit to
# .agents/mcp-servers.json. Exit 1 means updates are available (a skill, or a pin with a release
# past its 7-day cooldown); 2 means one needs review (removed, moved, a license changed, a pin
# yanked or mis-recorded); 3 means GitHub, npm or PyPI couldn't be reached. Each fails the run.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked --no-dev
      - name: Compare the catalog with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: "0"
        run: uv run --no-sync repo-template globals --upstream --standards-root .
