name: Catalog drift

# Weekly, compare every vendored skill and license text with its upstream repository, and each
# MCP server's pin with npm or PyPI. Read-only: the report goes to this log and to the run's
# summary page; upgrading a skill or re-pinning a server is a reviewed, local
# `repo-template globals --upgrade`. Exit 1 means updates are available (a skill, or a pin with a
# release past its 7-day cooldown); 2 means one needs review (removed, moved, a license changed,
# a pin yanked or mis-recorded); 3 means GitHub, npm or PyPI couldn't be reached. Each fails the
# run. The report's upstream text is already cleaned by the CLI; it is replayed into the log with
# workflow commands stopped, and reaches the summary only through a file, never an expression.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.15"
          enable-cache: false
      - run: uv python install
      - run: uv sync --locked --no-dev
      - name: Compare the catalog with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: "0"
        run: |
          set +e
          uv run --no-sync repo-template globals --upstream --standards-root . >report.txt 2>&1
          code=$?
          set -e
          token=$(openssl rand -hex 16) # no line of the report can run a workflow command
          echo "::stop-commands::$token"
          cat report.txt
          echo "::$token::"
          {
            echo "## Catalog drift"
            echo
            case "$code" in
              0) echo "Everything is current." ;;
              1) echo "Updates are available: follow each line of the report below, locally (skills: \`repo-template globals --upgrade\`; MCP servers: \`--upgrade mcp:<name>\`; per-machine tools: edit \`.agents/machine-tools.json\`)." ;;
              2) echo "Something needs review (a skill removed or moved, a license changed, or a pin to fix)." ;;
              3) echo "GitHub, npm or PyPI couldn't be reached: run it again later." ;;
              *) echo "The check failed (exit $code)." ;;
            esac
            echo
            echo '```text'
            sed 's/```/` ` `/g' report.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$code"
