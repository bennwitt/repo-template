[project]
name = "stagehand-mcp"
version = "0.1.0"
description = "A self-hosted Stagehand MCP server: a local or self-hosted Chrome and your own OpenAI-compatible model, never Browserbase."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastmcp==4.1.4",
  "httpx==0.28.1",
  "stagehand==4.4.0",
]

[project.scripts]
stagehand-mcp = "stagehand_mcp.server:main"

[dependency-groups]
dev = ["pytest==9.0.1", "pytest-asyncio==1.3.0"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv]
# The release cooldown: resolve nothing published in the last seven days.
exclude-newer = "2026-11-09T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
