[project]
name = "repo-template-mcp-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "fastmcp==4.1.4", "fastapi==0.142.4"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_example"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
