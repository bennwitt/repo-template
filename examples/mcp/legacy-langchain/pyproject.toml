[project]
name = "repo-template-legacy-langchain-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langchain-mcp-adapters==0.3.2", "mcp==1.26.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
