[project]
name = "repo-template-langchain-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langchain[mcp]==1.4.9",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-azure-ai[hosting]==1.3.0",
  "azure-ai-contentsafety==1.1.0b1",
  "azure-ai-contentunderstanding==1.2.0b2",
  "fastmcp==4.1.4",
  "fastapi[standard]==0.142.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_example"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

